# THROWAWAY LOAD-PROOF PROBE for arqtiqa/arqtos#344 -- arqtos-actions PR only,
# never merged, branch deleted after observation. Mirrors the method used for
# the arqtos#348 probe (see that Story's report): a real consumer resolving
# `uses:` at a candidate SHA is the only way to catch a template-validation
# failure, since YAML linting does not perform template validation.
#
# Proves action.yml at c2ee8f50d4b9ad28f70c8b69432aaa8e712780a0
# (feat/344-require-identity-overlay) still LOADS as a composite action, in
# both input shapes:
#   - probe-without-input: no require-identity-overlay at all (the shape
#     every one of the 15 existing callers is in) -- must behave exactly as
#     before this Story.
#   - probe-with-input: require-identity-overlay: 'true', no identity-overlay
#     secret wired, on an ORDINARY same-repo pull request (not a fork, not
#     Dependabot) -- expected to load fine and then correctly FAIL (exit 2,
#     the misconfiguration path), which is stronger evidence than a bare
#     load: it proves the whole pipeline ran (template parsed, composite
#     steps executed, script reached the new branch) AND that the
#     github.actor / github.event.pull_request.head.repo.fork expression
#     correctly evaluates to "secret could exist here" for a normal PR
#     (if it had wrongly evaluated true, this job would have passed instead).
name: firewall

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe-without-input:
    name: "probe: without require-identity-overlay (unchanged shape)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arqtiqa/arqtos-actions/.github/actions/firewall@c2ee8f50d4b9ad28f70c8b69432aaa8e712780a0  # probe: #344
        with:
          denylist: .github/scripts/private-content-denylist.txt

  probe-with-input:
    name: "probe: with require-identity-overlay=true (new shape)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arqtiqa/arqtos-actions/.github/actions/firewall@c2ee8f50d4b9ad28f70c8b69432aaa8e712780a0  # probe: #344
        with:
          denylist: .github/scripts/private-content-denylist.txt
          require-identity-overlay: 'true'
