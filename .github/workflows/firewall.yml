# ⚠️ THIS REPO IS PUBLIC. That is the whole reason this gate exists here.
#
# The private-content firewall stops private content reaching a public surface.
# It was running on private repos, where publishing is impossible, and absent
# from the public ones, where publishing is the point (arqtos-sdk-go#38). A
# repo with no firewall is the silent-clean failure state with the middle step
# removed: the green check is already there and nothing is scanning.
name: firewall

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked files against denylist
        # ⚠️ SHA-pinned, unlike the other shared actions here which use @v1, and
        # the baseline manifest requires it: this is the only shared action that
        # is a GATE. A compromised gate does not break the build — it returns a
        # GREEN CHECK on a repo whose scan is no longer running. Bump
        # deliberately, reading the diff.
        #
        # ⚠️ THIS IS THIS REPO'S OWN PIN OF ITS OWN ACTION (arqtos#346). It sat at
        # e294a60 while this repo's `main` moved on, so the repo that SHIPS the
        # exemptions mechanism had never exercised it against itself. Bumped to
        # b27c7456 (this repo's `main` at the time of this bump), which carries:
        #   - #341 -- path+rule exemptions (a caller-supplied `.firewallignore`)
        #   - #343 -- require content corroboration, not name alone, before the
        #     vendored-denylist basename skip drops a file from the scan
        #   - #348 -- stop an input description evaluating as a template
        #     expression, which had made this action unloadable for every
        #     consumer. This repo's own dogfood job was still testing the OLD
        #     scanner at the time and could not have caught it -- this pin is
        #     why #348 shipped at all.
        # Track directly, not via `v1`: that tag sits behind all three fixes
        # above and moving it is a separate, estate-wide, deliberate change.
        uses: arqtiqa/arqtos-actions/.github/actions/firewall@b27c7456bce9937159b6c59e3deb0c88692996cb  # main
        with:
          # ⚠️ The denylist lives HERE and is passed in. The action ships none
          # and must never ship one — read `action.yml`, which is in this same
          # repository. A missing list is exit 2 (misconfigured), never a pass.
          #
          # This is arqtos-actions' own caller list, scoped to its own audience.
          # It is NOT the action's default; the file's header says so too,
          # because this is the one repo where that mistake is possible.
          denylist: .github/scripts/private-content-denylist.txt

      # ⚠️ THE GATE ABOVE BEING GREEN IS NOT EVIDENCE THE DENYLIST STILL BITES
      # (arqtiqa/arqtos#361).
      #
      # A denylist decays silently, and every decay mode leaves the gate green:
      # a rule edited into a form that still COMPILES but matches nothing
      # (arqtos-cli#1092 was exactly that, one level down — the shared script
      # reported CLEAN when `grep` REJECTED a pattern), a rule deleted during an
      # unrelated edit, a rule added with nothing behind it. A green firewall
      # over a dead denylist is worse than no firewall, because it is trusted.
      #
      # Until now this repository's list rested on a one-time manual dry-run
      # performed when the gate was enabled — evidence it bit ONCE, on one day,
      # against one tree.
      - name: Prove every denylist rule still bites
        # ⚠️ RELATIVE, and only because this is THIS repository. A workflow may
        # compose by relative path (a composite action may not — there it would
        # resolve against the consumer), and here it is deliberate: consumers
        # pin a SHA, but the repository that SHIPS the falsifier must test the
        # falsifier it is about to ship, not the one it last released.
        #
        # ⚠️ That distinction is not theoretical here. This repo's own firewall
        # pin sat two mechanisms behind its own `main` (arqtiqa/arqtos#346), so
        # the repository shipping the exemptions mechanism had never exercised
        # it against itself — which is how #348 shipped a change that made the
        # action unloadable for every consumer.
        uses: ./.github/actions/firewall-falsifier
        with:
          # ⚠️ THE SAME list the gate above scans. Proving a different list
          # alive is the most convincing possible form of no coverage.
          denylist: .github/scripts/private-content-denylist.txt
