# THROWAWAY LOAD-PROOF PROBE for arqtiqa/arqtos#344 round-1 fix -- arqtos-actions
# PR only, never merged, branch deleted after observation. Mirrors the method
# used for the arqtos#348 probe and this Story's own round-0 probe (see the
# Story's report): a real consumer resolving `uses:` at a candidate SHA is the
# only way to catch a template-validation failure, since YAML linting does not
# perform template validation -- and this round changed the `github.*`-context
# expression in action.yml itself, so it is exactly the surface that needs
# re-proving.
#
# Proves action.yml at 4e831a66bc3fc02bee894fba9e03aacc035f7260
# (feat/344-require-identity-overlay, round-1 fix) still LOADS as a composite
# action, in both input shapes:
#   - probe-without-input: no require-identity-overlay at all (the shape
#     every one of the existing callers is in) -- must behave exactly as
#     before this Story.
#   - probe-with-input: require-identity-overlay: 'true', no identity-overlay
#     secret wired, on an ORDINARY same-repo pull request (not a fork, not
#     Dependabot) -- expected to load fine and then correctly FAIL (exit 2,
#     the misconfiguration path), which is stronger evidence than a bare
#     load: it proves the corrected predicate
#     (head.repo.full_name != github.repository) still correctly evaluates
#     to "secret could exist here" (false) for a normal same-repo PR.
name: firewall

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe-without-input:
    name: "probe: without require-identity-overlay (unchanged shape)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arqtiqa/arqtos-actions/.github/actions/firewall@4e831a66bc3fc02bee894fba9e03aacc035f7260  # probe: #344 round-1
        with:
          denylist: .github/scripts/private-content-denylist.txt

  probe-with-input:
    name: "probe: with require-identity-overlay=true (new shape)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arqtiqa/arqtos-actions/.github/actions/firewall@4e831a66bc3fc02bee894fba9e03aacc035f7260  # probe: #344 round-1
        with:
          denylist: .github/scripts/private-content-denylist.txt
          require-identity-overlay: 'true'
