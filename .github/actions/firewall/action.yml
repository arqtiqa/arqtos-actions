name: 'Private-content firewall'
description: 'Scan tracked files against a caller-supplied denylist. Fails when any pattern matches.'
author: 'arqtiqa/arqtos-actions'

# ⚠️ THIS ACTION SHIPS NO DENYLIST, AND THAT IS THE POINT.
#
# A denylist is a list of the things it protects, so a copy committed here —
# a PUBLIC repository — would publish exactly what it exists to guard. The
# caller supplies the path, and the caller's denylist stays scoped to the
# audience of the caller's repository.
#
# That asymmetry is the whole design: THE LOGIC IS SHARED, THE DATA IS NOT.
# One repository's list legitimately differs from another's — a repo readable
# by people outside the organisation must not carry maintainer-identity
# patterns, while an internal-only repo should. Centralising the data would
# force the union, which is the disclosure.
#
# ⚠️ AND A MISSING DENYLIST IS A MISCONFIGURATION, NEVER "CLEAN". The script
# exits 2 in that case, because a scan with nothing to scan against reports
# every file clean — which is worse than not running at all, since it looks
# like a pass. Do NOT add a default denylist to make this "convenient".

inputs:
  denylist:
    description: >-
      Path to the caller's denylist. REQUIRED — there is no default and no
      bundled fallback. An absent or unreadable file exits 2.
    required: true
  files:
    description: >-
      Newline- or space-separated file list to scan. Defaults to all tracked
      files (`git ls-files`).
    required: false
    default: ''
  exemptions:
    description: >-
      Path to a caller-supplied path+rule exemptions file (arqtiqa/arqtos-cli#851
      format: three MANDATORY fields per line, `<path-glob>  <rule>  <reason>`,
      a tab or 2+ spaces between fields). Optional -- when empty (the
      default), the script itself falls back to `.firewallignore` at the
      repository root if present; a missing DEFAULT is fine (no exemptions
      committed yet). An explicitly-set value naming a path that does not
      exist is a configuration error (exit 2). A stale entry -- a path glob
      matching no tracked file, or a VERBATIM rule matching no pattern active
      in this run -- is ALSO a configuration error, never a silent no-op.

      An identity-overlay rule is named by RULE HANDLE rather than by its text
      (arqtiqa/arqtos#365): `sha256:` plus the first 12 hex digits of the
      SHA-256 of the pattern. This file is committed and an overlay pattern is
      a secret, so an exemption has to name a rule it must never quote -- and
      a handle, unlike a position, cannot silently re-point at a different
      rule when the overlay is reordered. A handle that resolves to no active
      pattern (the overlay is absent in this context, or the rule was edited)
      is held INERT and disclosed, not a configuration error: the rule it
      named is then scanned rather than suppressed. A failing run prints the
      handle to use, so nobody computes one by hand.
    required: false
    default: ''
  identity-overlay:
    description: >-
      Identity-tier pattern TEXT (one pattern per line -- NOT a path, unlike
      `denylist` above) for the org secret `ARQTOS_FIREWALL_IDENTITY_OVERLAY`
      (arqtiqa/arqtos#342). Wire it in the caller's workflow the same way any
      secret reaches a composite action's input -- `identity-overlay:` set to
      `secrets.ARQTOS_FIREWALL_IDENTITY_OVERLAY` -- shown here without its
      enclosing double-brace expression syntax so this description does not
      itself embed a live expression (a composite action has no `secrets`
      context of its own).
      Identity patterns are never committed anywhere -- embedding them would
      compile confidential regex text into a world-readable release asset --
      so this is the only way to supply them, and it is unioned with
      `denylist` at scan time.

      Optional. Absent (unset, or the secret unavailable -- e.g. a
      Dependabot-triggered run, which GitHub never grants org secrets to)
      is a legitimate, STATED, credential-tier-only run -- it never fails
      just because the overlay is missing, so a caller wiring this input
      does not also need an actor-based skip the way a fail-closed consumer
      of the same secret does (see arqtiqa/arqtos-skills' `estate-identifiers`
      job for that pattern, needed there because that job has no
      credential-tier fallback to run instead).

      A value that IS supplied but resolves to zero usable pattern lines
      (all-comment, all-whitespace, a truncated secret) is a configuration
      error (exit 2), never a pass -- same rule `denylist` follows above,
      no `--allow-empty` escape hatch either. The overlay's own pattern text
      is never printed in the report (arqtiqa/arqtos-cli#1009).
    required: false
    default: ''
  require-identity-overlay:
    description: >-
      Opt-in (arqtiqa/arqtos#344): set to 'true' to make identity-tier
      coverage a REQUIREMENT rather than the best-effort default `#342`
      established. Default 'false' -- every existing caller of this action is
      unaffected unless it sets this explicitly. Only the literal strings
      'true' and 'false' are accepted; a security opt-in must not silently
      no-op on a typo ('TRUE', 'yes', '1', ...) -- any other value is a
      configuration error (exit 2), never treated as 'false'.

      THE DIFFICULTY THIS INPUT IS DESIGNED AROUND: the repositories that
      most need required identity coverage are exactly the repositories
      where GitHub withholds the identity-overlay secret -- a pull request
      whose head repository differs from this one, or a Dependabot-triggered
      run (its own separate secret store). Setting this to 'true' does NOT
      turn those runs red. This action detects that context itself (whether
      a pull request's head repository is this SAME repository, and
      Dependabot's actor identity, are both ordinary, ambient workflow-run
      facts, never something a caller's `with:` block supplies) and, in that
      case, reports that identity coverage could not be verified this run --
      credential-tier only, stated in a way distinct from both a clean run
      that had the overlay and a genuine failure. What DOES fail (exit 2) is
      the case this input exists to catch: the same repository, in a context
      where the secret is expected to be available, running without it --
      never wired, a secret renamed or rotated out from under the workflow,
      or a repository whose secret visibility never covered it.

      A repository adopting this input still needs the merge-time backstop
      the fork/Dependabot exemption depends on -- an unconditional
      `push: branches: [main]` trigger on the SAME workflow, so the run that
      lands on `main` once a fork PR merges executes with the real secret
      and actually verifies coverage for that change. This is the same
      pattern `arqtos-skills`' `estate-identifiers` job already uses (skip
      on Dependabot, recover via the push-triggered run). Setting this input
      states the intent; it does not by itself supply that backstop run --
      wire the trigger, or a fork contribution's identity coverage is never
      actually checked by anything, ever.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Scan tracked files against the caller's denylist
      shell: bash
      env:
        INPUT_DENYLIST: ${{ inputs.denylist }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_EXEMPTIONS: ${{ inputs.exemptions }}
        # ⚠️ Kept as its OWN step-env entry (not folded into the `run:` body's
        # local variables below) for the same reason denylist/files/exemptions
        # are: GitHub Actions masks a registered secret wherever it appears in
        # step output, and that masking is keyed off literal string values
        # flowing through the runner -- an env assignment is the documented,
        # supported path for that. The script reads this exact name
        # (ARQTOS_FIREWALL_IDENTITY_OVERLAY) directly; see check-private-content.sh's
        # module doc for why this is an env var and never a --flag (argv is
        # visible on the runner via `ps` to anything that can see the process;
        # an env var passed this way is not).
        ARQTOS_FIREWALL_IDENTITY_OVERLAY: ${{ inputs.identity-overlay }}
        ARQTOS_FIREWALL_REQUIRE_IDENTITY_OVERLAY: ${{ inputs.require-identity-overlay }}
        # ⚠️ NOT a caller-supplied input, deliberately (arqtiqa/arqtos#344) --
        # see require-identity-overlay's own description above for the full
        # "why". Derived purely from ambient `github.*` context: `github` is
        # available to a composite action's steps the same way `inputs` and
        # `env` are (unlike `secrets`, whose absence here is exactly #348's
        # lesson -- this expression uses none). A fork pull request's own
        # workflow file is never the one GitHub actually runs for a
        # `pull_request` trigger (the base branch's copy is), and
        # `github.actor` is set by the platform, not by workflow YAML -- so a
        # caller cannot spoof this to talk its way out of the requirement.
        #
        # ⚠️ arqtiqa/arqtos#344 round-1 review: `head.repo.fork` IS THE WRONG
        # QUESTION -- it means "the head repo is a fork OF ANYTHING", not "the
        # head repo differs from THIS run's base repo". A consuming repository
        # that is ITSELF a fork (of some upstream) would get the
        # withheld-exemption on EVERY same-repo pull request, where the
        # secret is in fact available -- silently converting the exit-2
        # "never wired" case into a green, unverified run on every PR that
        # repo has. Compare `head.repo.full_name` against `github.repository`
        # instead: that is "same repo or not", which is the actual question,
        # regardless of whether either side happens to be a fork of something
        # else. (0 of this action's current consumers are themselves forks,
        # so this was latent, not live -- but one `gh repo fork` away from
        # being live, and it would have failed silently and greenly.)
        #
        # `&&`/`||` short-circuit in GitHub Actions expressions, so on any
        # non-`pull_request` event (`push`, `pull_request_target`,
        # `workflow_run`, `merge_group`, ...) the left operand is false and
        # `github.event.pull_request.head.repo.full_name` is never evaluated
        # at all -- no null-vs-string comparison surprises, and the overall
        # expression always renders a literal `true` or `false` (`github.actor`
        # is populated on every event type), never empty, so nothing here
        # ever falls through to an inherited value.
        ARQTOS_FIREWALL_OVERLAY_MAY_BE_WITHHELD: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]' }}
      run: |
        set -euo pipefail

        # Locate the script relative to THIS action, not the caller's cwd.
        script="${{ github.action_path }}/check-private-content.sh"
        if [[ ! -x "$script" ]]; then
          echo "✗ firewall: $script is missing or not executable" >&2
          exit 2
        fi

        # ⚠️ Checked here as well as in the script. GitHub does NOT enforce
        # `required: true` for composite-action inputs, so the declaration above
        # is documentation, not a guarantee. Without this an empty input would
        # fall through to the script's own default-path resolution, and the
        # failure would name a path the caller never chose.
        if [[ -z "$INPUT_DENYLIST" ]]; then
          echo "✗ firewall: no denylist supplied." >&2
          echo "  This action ships none: a denylist committed to a public repo" >&2
          echo "  publishes what it protects. Pass the path to your own." >&2
          exit 2
        fi
        if [[ ! -f "$INPUT_DENYLIST" ]]; then
          echo "✗ firewall: denylist not found at $INPUT_DENYLIST" >&2
          exit 2
        fi

        # Only pass --exemptions through when the caller actually set one --
        # an empty input must fall to the SCRIPT's own default resolution
        # (.firewallignore at the repo root, absent-is-fine), not to a
        # literal empty path the script would then treat as explicitly named.
        exemptions_arg=()
        if [[ -n "$INPUT_EXEMPTIONS" ]]; then
          exemptions_arg=("--exemptions=$INPUT_EXEMPTIONS")
        fi

        # ⚠️ The default path delegates the file listing TO THE SCRIPT, which
        # builds it NUL-delimited from `git ls-files -z`. It used to be
        # `git ls-files | xargs` right here, and that silently dropped every
        # tracked path containing a space, tab, quote or backslash — reporting
        # CLEAN on files it never opened. Logic in YAML cannot be tested, which
        # is why that survived; the script's version is covered by tests.
        if [[ -n "$INPUT_FILES" ]]; then
          # An explicit list is newline-delimited, so a path may contain SPACES.
          # ⚠️ A path containing a NEWLINE cannot be expressed through this input
          # at all — use the default all-tracked mode for such a repo rather than
          # enumerating files here.
          # ⚠️ NO xargs. It substitutes its OWN exit status — GNU maps any child
          # 1..125 to 123, BSD to 1 — so the script's 2 (misconfigured) arrived
          # as 1 (matched), making a gate that did not run properly look like a
          # gate that caught something. The script now reads the NUL-delimited
          # list itself, so the status the caller sees is the script's.
          printf '%s' "$INPUT_FILES" | tr '\n' '\0' \
            | "$script" "--denylist=$INPUT_DENYLIST" "${exemptions_arg[@]+"${exemptions_arg[@]}"}" --files0
        else
          "$script" "--denylist=$INPUT_DENYLIST" "${exemptions_arg[@]+"${exemptions_arg[@]}"}" --all-tracked
        fi
