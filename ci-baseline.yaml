# ci-baseline.yaml — the one declared source for shared CI action versions.
#
# Read by the ci-baseline gate, which fails a pull request pinning a governed
# action off this manifest. A violation message cites this file by path, so its
# location is part of the contract.
#
# ⚠️ WHY A MANIFEST RATHER THAN A CONVENTION. An unenforced convention decays
# silently, and the decay is invisible *because CI stays green*. Before this
# file existed, one organisation's repositories carried three different versions
# of `actions/checkout`, three of `actions/setup-go` and two of
# `actions/upload-artifact` — and two repositories used two versions of the same
# action INSIDE THEMSELVES, so there was no "current version" to read off even
# locally.
#
# ⚠️ AND THE DRIFT IS BEHAVIOURAL, NOT COSMETIC. `checkout` v4 -> v7 changes the
# Node runtime and default fetch behaviour; `setup-go` v5 -> v7 changes caching
# defaults. Two repositories whose workflows look identical do not run the same
# CI — so results across them are not comparable, and a gate can pass in one and
# fail in another on the same input.
#
# This file is PUBLIC, and deliberately carries no organisation specifics: no
# repository names, no work-item references, no internal metrics. Version pins
# are not sensitive; which of your repositories lags is. The mechanism is
# public, the estate detail is not — the same split the private-content firewall
# uses for its own patterns.

version: 1

# ---------------------------------------------------------------------------
# Governed actions — anything used by two or more repositories
# ---------------------------------------------------------------------------
#
# ⚠️ A pin is NOT max(seen). Taking the highest observed version is wrong twice
# over, because a bump changes behaviour in repositories that currently pass.
# Every pin here carries its reason, and every repository the pin MOVES must be
# re-run green before the change is complete. A bump that breaks a passing
# repository is not a baseline.

actions:
  actions/checkout:
    pin: v7
    why: >-
      Latest major, and a moving major tag is published so `v7` tracks patches
      without a re-pin. ⚠️ Consumers that fetch tags need care across this
      bump: checkout leaves the tag REF but not necessarily the annotated tag
      OBJECT, and for a release workflow the annotation IS the release notes. A
      workflow carrying an explicit tag-fetch workaround must re-verify whether
      it is still needed or now wrong — the failure mode is a silently empty
      release, which no test catches.

  actions/setup-go:
    pin: v7
    why: >-
      Latest major with a moving major tag. ⚠️ Verify caching across this bump:
      an explicit `cache: true` should survive, but the CACHE-KEY computation is
      what to check. A silently changed key means a silently cold cache, which
      presents as nothing except slower jobs. Prefer `go-version-file: go.mod`
      over a pinned version, so the toolchain follows the module.

  actions/upload-artifact:
    pin: v7
    why: Latest major with a moving major tag.

  astral-sh/setup-uv:
    pin: v9.0.0
    exact: true
    direct_reference: forbidden
    why: >-
      ⚠️ EXACT pin, unlike every other entry: this action publishes NO moving
      major tag, so `@v9` does not resolve.
      ⚠️ AND CONSUMERS MUST NOT REFERENCE IT DIRECTLY — use
      `.github/actions/python-toolchain@v1`, which wraps it. This is the rule
      that keeps the pin a SINGLE source instead of a second one: a composite
      action cannot read this manifest to discover its own version, so the
      literal must live inside the action. Forbidding direct references is what
      guarantees it lives there AND NOWHERE ELSE. A direct reference is a gate
      violation, not a style preference — it re-creates the drift surface this
      file exists to remove, and it was duplicated 11 times before the wrapper
      existed.

  arqtiqa/arqtos-actions:
    pin: v1
    why: >-
      This repository's own composite actions, referenced as
      `arqtiqa/arqtos-actions/.github/actions/<name>@v1`. A moving major tag:
      `@main` would put every commit live in every consumer with no review in
      any of them, and an exact SHA reintroduces one bump per consumer — the
      cost a single source exists to remove. ⚠️ The tag moves on a DELIBERATE
      act, which makes retagging the reviewable moment, not a chore.
    per_action_overrides:
      # ⚠️ THE FIREWALL IS PINNED TO A COMMIT SHA, NOT THE MOVING TAG.
      #
      # Not inconsistency — the actions differ in HOW THEY FAIL, and only this
      # one fails silently:
      #
      #   python-toolchain   compromised -> the build BREAKS. uv is missing,
      #                      tests do not run. Loud, immediate, unmissable.
      #   resolve-canary     compromised -> breaks loudly; trivial by design.
      #   firewall           compromised -> ⚠️ CAN REPORT CLEAN. The scan simply
      #                      finds nothing, and a green check appears on a repo
      #                      whose private-content gate is no longer running.
      #
      # A gate that fails silently-clean is the failure mode this whole file
      # exists to remove, reappearing one level up — the same shape as a missing
      # denylist reading as clean, which is why THAT case is an exit-2.
      #
      # So the N-bumps cost the moving tag exists to avoid is paid ONCE, for the
      # one action where nobody would notice the failure. Everything else keeps
      # `@v1`.
      #
      # ⚠️ A consumer of the firewall action MUST use a 40-char SHA. The gate
      # treats `@v1` on the firewall as a violation, and a SHA on any other
      # action as one too — the exception is deliberate and narrow, not a
      # loosening.
      firewall:
        pin_style: commit-sha
        why: >-
          The only shared action that is a security GATE. Its failure mode is a
          green check rather than a broken build, so it does not get a moving
          reference. Bump it deliberately, reviewing the upstream diff.
        annotate: >-
          Pin as `<40-char-sha>  # v1` so a human can still read which release
          it corresponds to.

      # ⚠️ firewall-falsifier IS DELIBERATELY ABSENT FROM THIS BLOCK — it keeps
      # `@v1`, like everything except the gate itself. It was proposed as a
      # second `commit-sha` entry and that proposal was REFUSED; this note is
      # here so the question is not re-opened from scratch every time someone
      # notices that a falsifier, too, can go green while proving nothing.
      #
      # THE CASE THAT WAS MADE FOR SHA-PINNING IT: it proves the gate's denylist
      # still MATCHES, so a subverted falsifier reports every rule alive while
      # the firewall it vouches for may be scanning against a dead list — and a
      # subverted falsifier is worse than an absent one, because an absent one
      # leaves a known gap while a subverted one closes it on paper.
      #
      # ⚠️ WHY THAT IS NOT ENOUGH, ON THIS FILE'S OWN STATED CRITERION. The test
      # here is not "can it fail silently" — go-fmt can too, and keeps `@v1`.
      # It is whether the SILENCE IS RECOVERABLE. And the falsifier's is:
      #
      #   firewall silent-clean       private content is published. Unbounded
      #                               and UNRECOVERABLE — you cannot un-publish.
      #   falsifier silent-live       nothing is published by this. Its evidence
      #                               (the denylist, the corpus) is entirely
      #                               committed, so the NEXT honest run names
      #                               every dead rule. Nothing is lost meanwhile
      #                               — the gate is still running, still
      #                               SHA-pinned, and is still what stands
      #                               between private content and publication.
      #
      # The falsifier's silence is a DETECTION gap, not a DISCLOSURE gap. For
      # content to actually escape, the denylist must ALSO be dead AND private
      # content must ALSO be committed — and the gate, which is SHA-pinned,
      # is the thing that would have to fail for that to matter.
      #
      # ⚠️ AND IT FAILS CLOSED UNDER "DID NOTHING", WHICH THE GATE DOES NOT.
      # This is the structural half, and it is the sharper argument. The gate
      # asserts a NEGATIVE ("nothing matched"), so a run that scanned nothing
      # SATISFIES it — that is the whole silent-clean failure. The falsifier
      # asserts a POSITIVE ("every rule matched something"), so a run that
      # scanned nothing VIOLATES it. A degraded falsifier goes red by
      # construction rather than green.
      #
      # ⚠️ THE COST OF THE MOVING TAG, STATED. `@v1` means the falsifier drives
      # the scanner sitting beside it AT v1, while a consumer's gate runs its
      # own SHA-pinned build. Those can differ. Today they do not — v1 and every
      # consumer's pin carry a byte-identical `.github/actions/firewall/` — but
      # nothing enforces that, so a future divergence could have the falsifier
      # prove a list alive under one matching engine while a different engine
      # guards the repository. If that ever becomes real, the fix is to make the
      # falsifier REPORT the scanner build it used, so the mismatch is visible,
      # rather than to buy visibility with N per-consumer bumps.
      #
      # If this is re-opened, re-open it on the recoverability criterion above,
      # not on "it can fail silently" — that much is common to half this file.

      # ⚠️ go-fmt KEEPS `@v1` even though it, too, can fail silently-clean —
      # and that needs saying, because the rule above is stated in terms of
      # FAILURE MODE and a naive reading puts go-fmt in the SHA-pinned column.
      #
      # A subverted go-fmt returns green on an unformatted tree, exactly like a
      # subverted firewall returns green on a leaking one. The modes match. What
      # differs is the COST of the silence:
      #
      #   firewall silent-clean   private content is published. Unbounded, and
      #                           unrecoverable — you cannot un-publish it.
      #   go-fmt silent-clean     unformatted code reaches main. Bounded, and
      #                           self-correcting: the next honest run names every
      #                           file, and `make fmt` fixes all of them.
      #
      # So the criterion is not "can it fail silently" but "is the silence
      # RECOVERABLE". Paying the N-bumps-per-consumer cost to protect formatting
      # would spend the single-source benefit on the one thing that repairs itself.
      #
      # ⚠️ If go-fmt ever gains a non-formatting responsibility — a license header
      # check, a generated-code freshness assert, anything whose silent pass hides
      # something you cannot fix after the fact — this override is wrong and it
      # moves to commit-sha. The trigger is the action's SCOPE changing, not its
      # name.
      go-fmt:
        pin_style: moving-tag
        why: >-
          Invokes the CALLER's `make fmt-check` rather than running gofmt itself,
          so the definition lives in each repo's Makefile and this action is only
          the invocation. Its silent-failure cost is recoverable (see above), so it
          keeps the moving tag the single source exists to provide.
        adopted_by: >-
          arqtos-cli, arqtos-sdk-go, arqtos-connectors — three consumers, which is
          why omitting this entry would itself be a manifest violation.

# ---------------------------------------------------------------------------
# The two-consumer rule
# ---------------------------------------------------------------------------
#
# ⚠️ An action is governed here only when TWO OR MORE repositories need it.
# Centralising by default relocates coupling into a shared repository and makes
# it a dumping ground. A single-consumer action stays local and is IGNORED by
# the gate — its absence from this file is a statement, not an omission.
#
# Do not list single-consumer actions here even "for completeness": a name in
# this file reads as governed, and the gate would start enforcing a version on a
# repository that is the only one entitled to choose it.

# ---------------------------------------------------------------------------
# Job timeouts
# ---------------------------------------------------------------------------
#
# ⚠️ A default of 30 minutes, not the platform's 360. A job that has run for
# half an hour is wedged, not busy, and 360 minutes of a wedged job is six hours
# of hidden breakage. Measured before setting this: not one workflow in the
# estate declared `timeout-minutes` at all, so every job silently inherited 360.
#
# ⚠️ AN OVERRIDE MUST BE EXPRESSIBLE, and this is not a convenience. Some jobs
# legitimately scale with their input — a mutation-survey gate runs its suite
# once per mutation, by design. Without an override the first such job either
# breaks or is exempted, and an exemption granted for a GOOD reason is the
# precedent that later launders bad ones.
#
# ⚠️ AND FOR SUCH A JOB, A TIMEOUT KILL IS INDISTINGUISHABLE FROM A PASS when
# results stream per-item as they complete. Two consequences: the timeout must
# not be reachable by simply adding items, and the job must fail loudly on kill
# rather than report partial success.

timeouts:
  default_minutes: 30
  overridable: true
  requires_reason: true

# ---------------------------------------------------------------------------
# Exceptions
# ---------------------------------------------------------------------------
#
# A repository that must deviate declares it BESIDE ITS OWN WORKFLOWS:
#
#     # .github/ci-baseline-exceptions.yml
#     exceptions:
#       - action: actions/checkout
#         pin: v5
#         why: "<the reason>"
#         expires: 2026-12-31
#
# ⚠️ In-repo, so it appears in the pull request that adds it and someone sees
# it. An exception configured centrally, or inferred from silence, is how a
# baseline decays into a suggestion.
#
# ⚠️ `expires` is REQUIRED. An exception with no date is a permanent carve-out
# wearing the costume of a temporary one.

exceptions_file: .github/ci-baseline-exceptions.yml
